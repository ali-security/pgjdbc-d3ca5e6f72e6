sudo: false
language: java
dist: trusty
# pgjdbc 42.7.x settings.gradle.kts refuses to launch Gradle on anything older than Java 17
jdk: openjdk17

branches:
  except:
    - /^tmp\/.*/
    - /^REL.*/

before_script:
  # The Travis postgresql addon no longer starts a server on the current build image, so the
  # project's own docker/postgres-server compose provides PostgreSQL (its post-startup.sh creates
  # the test user/databases; it also enables SSL, XA and the 5433/5434 replicas).
  - sudo systemctl stop postgresql
  - (cd docker/postgres-server && PGV=$PG_VERSION CREATE_REPLICAS=yes docker compose up -d)
  # Replicas start during the image's init phase, before the primary restarts on 5432: wait for both
  - for i in $(seq 1 90); do (cd docker/postgres-server && docker compose exec -T pgdb pg_isready -h 127.0.0.1 -p 5434 && docker compose exec -T pgdb pg_isready -h 127.0.0.1 -p 5432) && break; sleep 2; done
  - (cd docker/postgres-server && docker compose exec -T pgdb pg_isready -h 127.0.0.1 -p 5432 && docker compose logs)
  - echo enable_ssl_tests=true > ssltest.local.properties

env:
  global:
    - secure: "NI+aqwRLLVt2feJdk/2ZEZnsaPyu+vOx8MahVxjz0UUVvRHVqxM5O1M0R53NJfEeIjflOzgZJwRLqgyl6dkdfjytRhaHWGptQdehV4cwNb+4epnn8WlpRzMac65zTQqnbGVtw9jissDQv6/Zl/+D+DMcU65BbFZkix40whILXG0="

before_install:
  - unset _JAVA_OPTIONS # see https://github.com/travis-ci/travis-ci/issues/8408

script:
  # make sure previous build artifacts are not used for subsequent builds
  - rm -rf $HOME/.m2/repository/org/postgresql
  - ./.travis/travis_build.sh
  # Print every skipped test with its reason as the last output of the run
  - python3 .github/seal-skip-report.py .

before_cache:
  - F=CleanupGradleCache sh -x -c 'curl -O https://raw.githubusercontent.com/vlsi/cleanup-gradle-cache/v1.x/$F.java && javac -J-Xmx128m $F.java && java -Xmx128m $F'
  - find $HOME/.ivy2 -name "ivydata-*.properties" -print0 | xargs -0 rm -v
  - rm -rf $HOME/.ivy2/cache/org.postgresql/
  - find $HOME/.sbt -name "*.lock" -print0 | xargs -0 rm -v
  # No sense in caching current build artifacts
  - rm -rf $HOME/.m2/repository/org/postgresql

# Skip default "mvn install" issued by Travis
# Root project cannot be compiled with older JDKs, so it makes sense to just skip the step
install: true

cache:
  directories:
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/
    - $HOME/.m2/repository
    - $HOME/.ivy2/cache
    - $HOME/.sbt/boot/

matrix:
  fast_finish: true
  include:
    - env:
        - PG_VERSION=14
        - REPLICATION=Y
        - MVN_CUSTOM_ARGS="-PskipForbiddenApis -PskipOpenrewrite -Ps3.build.cache=false --no-build-cache"
